[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "whiteout"
version = "0.1.0"
description = "Coordination layer for a heterogeneous ArduPilot/MAVLink fleet over Arctic terrain"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "networkx",
    # The arena speaks MAVLink over UDP, one endpoint per asset
    # (hackathon/ARENA.md section 3). Pure Python, no build step.
    "pymavlink",
]

[project.optional-dependencies]
dev = [
    # ruff and mypy are pinned exactly: their output is the gate's pass/fail
    # signal, and 45 implementers plus CI run that gate. A minor release that
    # adds a rule or changes the formatter would turn every open PR red at
    # once, with no source change and no local reproduction.
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest",
    "build",
    # The gate builds with `--no-isolation` (SPEC.md section 6), so the build backend
    # has to be present in the environment rather than fetched from PyPI. setuptools
    # vendors bdist_wheel from 70.1, so no separate `wheel` is needed.
    "setuptools>=70.1",
]

[project.scripts]
whiteout = "whiteout.cli:main"

[tool.setuptools.packages.find]
include = ["whiteout*"]
exclude = ["tests*", "viz*", "artifacts*", "fixtures*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".claude",
    ".git",
    ".venv",
    "artifacts",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["whiteout"]
exclude = "(^|/)(\\.claude|\\.venv|artifacts|build|dist)/"

[tool.pytest.ini_options]
addopts = "-p no:randomly --strict-markers"
testpaths = ["tests"]
norecursedirs = [".claude", ".git", ".venv", "artifacts", "build", "dist", "viz"]
markers = [
    "slow: wall-clock or long-running; deselected by the gate, run by the tuner",
]

[[tool.mypy.overrides]]
# pymavlink ships no stubs and no py.typed marker. It is the arena's wire
# protocol and there is no alternative to it, so the adapter holds its
# messages as `Any` and the seam's own types are what stay checked.
module = ["pymavlink.*"]
ignore_missing_imports = true
